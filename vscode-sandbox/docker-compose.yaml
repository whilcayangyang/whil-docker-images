services:
  vscode-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AUTHORIZED_KEYS: "${AUTHORIZED_KEYS:-}"
    image: localhost/vscode-sandbox:local
    container_name: vscode-sandbox
    ports:
      - "2222:22"
    environment:
      AUTHORIZED_KEYS: "${AUTHORIZED_KEYS}"
    restart: unless-stopped
