apiVersion: v1
kind: Service
metadata:
  name: <APP_NAME>-ssh  # e.g. vscode-sandbox-ssh
  namespace: <NAMESPACE>
  annotations:
    metallb.io/address-pool: <METALLB_POOL>  # e.g. homelab-pool
    metallb.io/loadBalancerIPs: <LOADBALANCER_IP>  # e.g. 192.0.2.10
spec:
  type: LoadBalancer
  selector:
    app: <APP_NAME>
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
