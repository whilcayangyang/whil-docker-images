apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: <APP_NAME>  # e.g. vscode-sandbox
  namespace: <NAMESPACE>
spec:
  serviceName: <APP_NAME>
  replicas: 1
  selector:
    matchLabels:
      app: <APP_NAME>
  template:
    metadata:
      labels:
        app: <APP_NAME>
    spec:
      serviceAccountName: <APP_NAME>
      securityContext:
        fsGroup: <UID_GID>  # e.g. 1000
      containers:
        - name: <APP_NAME>
          # renovate: depName=<IMAGE_REPO> versioning=loose
          image: <IMAGE_REPO>:<IMAGE_TAG>  # e.g. ghcr.io/<org>/<repo>/vscode-sandbox:sha-<commit>
          imagePullPolicy: Always
          securityContext:
            runAsUser: <ROOT_UID>  # 0 — required for entrypoint.sh privilege drop, see repo CLAUDE.md
            allowPrivilegeEscalation: true # sudo is a SUID binary; no_new_privs silently breaks SUID exec
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN # entrypoint.sh — chown /home/whil and .ssh/ to whil:whil
                - FOWNER # entrypoint.sh — chmod 750/700/600 on PVC-mounted dirs
                - DAC_OVERRIDE # entrypoint.sh — ssh-keygen -A writes host keys to /etc/ssh/; sshd reads them
                - NET_BIND_SERVICE # sshd binds port 22 (< 1024)
                - SETUID # sshd: drop from root to UID 1000 after auth; sudo SUID binary
                - SETGID # sshd: drop from root to GID 1000 after auth
                - KILL # sshd: signal privsep child and session processes
                - AUDIT_WRITE # sshd: audit_log_acct_message() on login events
                - SYS_CHROOT # sshd: privsep chroot("/run/sshd") before auth
          ports:
            - containerPort: 22
              name: ssh
          env:
            - name: AUTHORIZED_KEYS
              valueFrom:
                secretKeyRef:
                  name: <APP_NAME>-ssh-keys  # e.g. vscode-sandbox-ssh-keys
                  key: authorized_keys
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "3Gi"
          volumeMounts:
            - name: home
              mountPath: /home/<USERNAME>  # e.g. /home/sandbox
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: <APP_NAME>-home  # e.g. vscode-sandbox-home
