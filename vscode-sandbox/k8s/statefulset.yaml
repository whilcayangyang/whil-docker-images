apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vscode-sandbox
  namespace: vscode-sandbox
spec:
  serviceName: vscode-sandbox
  replicas: 1
  selector:
    matchLabels:
      app: vscode-sandbox
  template:
    metadata:
      labels:
        app: vscode-sandbox
    spec:
      serviceAccountName: vscode-sandbox
      securityContext:
        fsGroup: 1000        # PVC volumes get GID 1000 (whil) on mount
        runAsUser: 0         # root required: sshd binds port 22 and switches UIDs
      containers:
        - name: vscode-sandbox
          image: ghcr.io/whilcayangyang/whil-docker-images/vscode-sandbox:latest
          ports:
            - containerPort: 22
              name: ssh
          env:
            - name: AUTHORIZED_KEYS
              valueFrom:
                secretKeyRef:
                  name: vscode-sandbox-ssh-keys
                  key: authorized_keys
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true  # sshd forks privilege-separation child then drops to UID 1000
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN           # entrypoint.sh:9,38 — chown /home/whil and .ssh/ to whil:whil
                - FOWNER          # entrypoint.sh:10,14,39 — chmod 750/700/600 on PVC-mounted dirs
                - DAC_OVERRIDE    # entrypoint.sh:46 — ssh-keygen -A writes host keys to /etc/ssh/; sshd reads them
                - NET_BIND_SERVICE # Dockerfile:108 EXPOSE 22 — sshd binds port 22 (< 1024)
                - SETUID          # sshd: drop from root to UID 1000 (whil) after auth; sudo SUID binary (Dockerfile:59)
                - SETGID          # sshd: drop from root to GID 1000 (whil) after auth
                - KILL            # sshd: send SIGHUP/SIGTERM to privilege-separation child and session processes
                - AUDIT_WRITE     # sshd: audit_log_acct_message() on login events (graceful without it; avoids log noise)
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "3Gi"
          volumeMounts:
            - name: home
              mountPath: /home/whil
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: vscode-sandbox-home
